name: Version release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/cache@v6
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
      - run: yarn
      - run: yarn build
      - run: yarn coverage

  publish-npm:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: yarn
      - run: yarn build
      # npm authenticates through the trusted publisher for this workflow.
      - name: Publish to npm
        run: |
          # If the release is marked as latest on GitHub, omit the npm tag and
          # let npm default to latest. Otherwise publish under the major version
          # line, for example v-3.
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)"

          if [ "$GITHUB_REF_NAME" = "$latest_tag" ]; then
            npm publish --access public
          else
            major="$(echo "$GITHUB_REF_NAME" | sed -E 's/^v?([0-9]+).*/\1/')"
            npm publish --access public --tag "v-${major}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
